              education: "Колледжи: Пищевой колледж №33, МГУТУ им. Разумовского, курсы: Novikov School, Ask the Chef" },

              education: "Колледжи: МКЭиИТ, МГОК, МГКЭТ, курсы при учебных центрах" },
            { title: "Сварщик", skills: ["technical", "organization"], 
              salary: "40–130 тыс. ₽",
              education: "Колледжи: МГОК, МКЭиИТ, курсы сварщиков" },
            { title: "Строитель (отделочник)", skills: ["technical", "organization"], 
              salary: "40–90 тыс. ₽, прораб: от 120 тыс. ₽",
              education: "Колледжи: МОК ЗАПАД, МГОК, КСУ №54, курсы" },
            
            // Творчество и дизайн
            { title: "Графический дизайнер", skills: ["creative", "technical"], 
              salary: "Junior: 50–80 тыс. ₽, Middle: 90–150 тыс. ₽, Senior: от 180 тыс. ₽",
              education: "Британка, ВШЭ (дизайн), МГУ (искусствоведение), курсы: Contented, Skillbox" },
            { title: "SMM-менеджер", skills: ["creative", "communication"], 
              salary: "Junior: 60–90 тыс. ₽, Middle: 100–150 тыс. ₽, Senior: от 180 тыс. ₽",
              education: "МГУ (журфак), ВШЭ (медиа), РГГУ, курсы: Skillbox, Нетология, Bang Bang Education" },
            { title: "Фотограф", skills: ["creative", "technical"], 
              salary: "от 50 до 300 тыс. ₽ (фриланс/студия)",
              education: "Школы фотографии: Photoplay, Академия фотографии, МГУ (журфак), курсы" },
            { title: "Архитектор", skills: ["creative", "analytics", "technical"], 
              salary: "80–300 тыс. ₽",
              education: "МАРХИ, МГСУ, МАМИ" },
            { title: "Дизайнер интерьеров", skills: ["creative", "organization"], 
              salary: "60–250 тыс. ₽",
              education: "Британка, МГАХИ, курсы: Skillbox, Geometrium" },
            
            // Образование и наука
            { title: "Учитель начальных классов", skills: ["empathy", "communication"], 
              salary: "45–90 тыс. ₽ (в Москве с надбавками)",
              education: "МПГУ, МГПУ, МГУ (педагогика), педколледжи №4, №13" },
            { title: "Преподаватель вуза", skills: ["analytics", "communication"], 
              salary: "50–150 тыс. ₽",
              education: "МГУ, ВШЭ, МФТИ, аспирантура" },
            { title: "Научный сотрудник", skills: ["analytics", "autonomy"], 
              salary: "60–200 тыс. ₽",
              education: "МГУ, МФТИ, РАН, аспирантура" },
            
            // Спорт и фитнес
            { title: "Спортивный тренер", skills: ["communication", "leadership"], 
              salary: "40–120 тыс. ₽",
              education: "РГУФКСМиТ, МГАФК, колледжи физической культуры" },
            { title: "Фитнес-инструктор", skills: ["communication", "empathy"], 
              salary: "40–120 тыс. ₽",
              education: "Курсы: FitMost, колледжи" },
            
            // Юриспруденция и экономика
            { title: "Юрист", skills: ["analytics", "communication"], 
              salary: "Junior: 50–80 тыс. ₽, Middle: 90–150 тыс. ₽, Senior: от 200 тыс. ₽",
              education: "МГУ (юрфак), МГЮА, ВШЭ (право), РУДН" },
            { title: "Экономист", skills: ["analytics", "organization"], 
              salary: "50–200 тыс. ₽",
              education: "ВШЭ, РЭУ им. Плеханова, МГУ (эконом)" },
            { title: "Бухгалтер", skills: ["analytics", "organization"], 
              salary: "40–150 тыс. ₽",
              education: "РЭУ, колледжи, курсы 1С" },
            
            // Логистика и управление
            { title: "Логист", skills: ["organization", "analytics"], 
              salary: "50–150 тыс. ₽",
              education: "РУТ (МИИТ), ГУУ, ВШЭ (менеджмент), колледжи" },
            { title: "Project Manager", skills: ["organization", "leadership"], 
              salary: "Junior: 80–120 тыс. ₽, Middle: 150–200 тыс. ₽, Senior: от 250 тыс. ₽",
              education: "ВШЭ (менеджмент), РАНХиГС, курсы: Нетология, ProductStar" },
            { title: "Предприниматель", skills: ["leadership", "creative"], 
              salary: "от 100 тыс. до 1 млн+ ₽",
              education: "Сколково, ВШЭ, РАНХиГС, бизнес-школы" },
            
            // Обслуживание и сервис
            { title: "Парикмахер", skills: ["creative", "communication"], 
              salary: "40–150 тыс. ₽",
              education: "Колледжи сферы услуг, курсы: Persona, Beauty School" },
            { title: "Косметолог", skills: ["technical", "empathy"], 
              salary: "50–200 тыс. ₽",
              education: "Медколледжи, курсы: Академия красоты" },
            { title: "Бариста", skills: ["communication", "organization"], 
              salary: "35–80 тыс. ₽",
              education: "Школы бариста: Coffee Institute, колледжи" },
            { title: "Эколог", skills: ["analytics", "empathy"], 
              salary: "40–120 тыс. ₽",
              education: "МГУ (почвоведение), РУДН (экология), МИТХТ" }
        ];

        // Текущие данные игры
        let currentSkills = { ...SKILLS };
        let currentSituationIndex = 0;
        let chartInstance = null;

        // DOM-элементы
        const gameScreen = document.getElementById('gameScreen');
        const resultScreen = document.getElementById('resultScreen');
        const situationTitle = document.getElementById('situationTitle');
        const situationDesc = document.getElementById('situationDesc');
        const answersContainer = document.getElementById('answersContainer');
        const currentStepSpan = document.getElementById('currentStep');
        const totalStepsSpan = document.getElementById('totalSteps');
        const archetypeEl = document.getElementById('archetype');
        const professionsDetailedEl = document.getElementById('professionsDetailed');
        const restartBtn = document.getElementById('restartBtn');

        totalStepsSpan.textContent = SITUATIONS.length;

        function resetGame() {
            currentSkills = { ...SKILLS };
            currentSituationIndex = 0;
            gameScreen.classList.remove('hidden');
            resultScreen.classList.add('hidden');
            renderSituation();
        }

        function renderSituation() {
            if (currentSituationIndex >= SITUATIONS.length) {
                showResult();
                return;
            }
            const sit = SITUATIONS[currentSituationIndex];
            situationTitle.textContent = sit.title;
            situationDesc.textContent = sit.desc;
            currentStepSpan.textContent = currentSituationIndex + 1;

            answersContainer.innerHTML = '';
            sit.answers.forEach((ans) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = ans.text;
                btn.addEventListener('click', () => handleAnswer(ans.effects));
                answersContainer.appendChild(btn);
            });
        }

        function handleAnswer(effects) {
            for (let [skill, value] of Object.entries(effects)) {
                if (currentSkills.hasOwnProperty(skill)) {
                    currentSkills[skill] += value;
                }
            }
            currentSituationIndex++;
            renderSituation();
        }

        function getProfessionScore(prof, skills) {
            let score = 0;
            for (let s of prof.skills) {
                score += skills[s] || 0;
            }
            return score;
        }

        function calculateResult() {
            const sortedSkills = Object.entries(currentSkills)
                .sort((a, b) => b[1] - a[1])
                .map(entry => entry[0]);
            const topSkill = sortedSkills[0];

            let archetype = '';
            switch (topSkill) {
                case 'creative': archetype = 'Креативный генератор'; break;
                case 'analytics': archetype = 'Аналитик данных'; break;
                case 'communication': archetype = 'Душа компании'; break;
                case 'organization': archetype = 'Мастер порядка'; break;
                case 'empathy': archetype = 'Эмпат-психолог'; break;
                case 'technical': archetype = 'Техногик'; break;
                case 'leadership': archetype = 'Прирождённый лидер'; break;
                case 'autonomy': archetype = 'Свободный художник'; break;
                default: archetype = 'Исследователь';
            }

            const scored = PROFESSIONS.map(prof => ({
                ...prof,
                score: getProfessionScore(prof, currentSkills)
            }));
            scored.sort((a, b) => b.score - a.score);
            const topProfessions = scored.slice(0, 4);

            return { archetype, professions: topProfessions };
        }

        function showResult() {
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            const { archetype, professions } = calculateResult();
            archetypeEl.textContent = archetype;

            let profHTML = '<div style="margin: 16px 0;"><h3 style="color: #ffd966;">🔥 Твои профессии</h3>';
            professions.forEach(prof => {
                profHTML += `
                    <div style="background: rgba(255,255,255,0.1); border-radius: 24px; padding: 16px; margin: 12px 0; text-align: left;">
                        <div style="font-size: 1.5rem; font-weight: bold; color: #ffb3b3;">${prof.title}</div>
                        <div style="font-size: 1.1rem; color: #a0e7a0; margin: 8px 0;">💰 ${prof.salary}</div>
                        <div style="font-size: 1rem; color: #b0c4ff;">🏫 ${prof.education}</div>
                    </div>
                `;
            });
            profHTML += '</div>';
            professionsDetailedEl.innerHTML = profHTML;

            // График навыков
            const labels = [];
            const data = [];
            for (let [key, value] of Object.entries(currentSkills)) {
                let displayName = {
                    analytics: 'Аналитика', creative: 'Креатив', communication: 'Коммуникация',
                    organization: 'Организация', empathy: 'Эмпатия', technical: 'Техника',
                    leadership: 'Лидерство', autonomy: 'Автономность'
                }[key] || key;
                labels.push(displayName);
                data.push(value);
            }

            const ctx = document.getElementById('skillsChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'уровень навыка',
                        data: data,
                        backgroundColor: 'rgba(255, 110, 196, 0.3)',
                        borderColor: '#ff9acb',
                        pointBackgroundColor: '#b5a9ff',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: '#b5a9ff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        r: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255,255,255,0.15)' },
                            pointLabels: { color: '#ddd', font: { size: 10 } },
                            ticks: { color: '#fff', backdropColor: 'transparent', stepSize: 2 }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#fff', font: { size: 12 } } }
                    }
                }
            });

            // ---------- Кнопка отправки результата в Telegram (если внутри Telegram) ----------
            if (window.Telegram && Telegram.WebApp) {
                const sendBtn = document.createElement('button');
                sendBtn.className = 'btn';
                sendBtn.textContent = '📤 Отправить результат в чат';
                sendBtn.style.marginTop = '10px';
                sendBtn.onclick = function() {
                    const resultData = {
                        archetype: archetype,
                        professions: professions.map(p => p.title),
                        skills: currentSkills
                    };
                    Telegram.WebApp.sendData(JSON.stringify(resultData));
                };
                document.querySelector('.result-area').appendChild(sendBtn);
            }
        }

        restartBtn.addEventListener('click', resetGame);
        resetGame();
    })();
</script>

</html>
